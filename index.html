<div class="c"><h2>Handtekening klant</h2><input id="snm" placeholder="Naam ondertekenaar" value="${esc(o.sigNaam)}" oninput="sn(this.value)">
<p class="mu" style="margin:4px 0 8px">Met zijn handtekening bevestigt de klant de uitgevoerde werken en aanvaardt hij de algemene voorwaarden.</p><details class="np" style="margin-bottom:8px"><summary class="mu" style="cursor:pointer">Algemene voorwaarden lezen</summary><ol class="mu" style="padding-left:18px">${TL().map(t=>`<li>${esc(t)}</li>`).join('')}</ol></details><canvas id="sg"></canvas><button class="b2 np" style="margin-top:8px" onclick="clrSig()">Wissen</button></div>
<div class="row wrap np" style="margin-bottom:24px">${done?'<button class="b2" onclick="reopen()">Heropenen</button>':'<button class="ok" onclick="fin()">Werkbon afronden</button>'}<button onclick="pdf()">Exporteer als pdf</button><button class="red" onclick="delO()">Verwijderen</button></div>`}

function initSig(id,get,set){const c=$('#'+id);if(!c)return;const d=devicePixelRatio||1,w=c.clientWidth,h=260;c.width=w*d;c.height=h*d;const x=c.getContext('2d');x.scale(d,d);x.lineWidth=2.4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#111';
 const lock=()=>c.classList.add('lk');c.classList.remove('lk');
 if(get()){const i=new Image;i.onload=()=>x.drawImage(i,0,0,w,h);i.src=get();lock()}
 let dr=0,tm;const p=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
 c.onpointerdown=e=>{clearTimeout(tm);dr=1;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e));e.preventDefault()};
 c.onpointermove=e=>{if(dr){x.lineTo(...p(e));x.stroke()}};
 c.onpointerup=c.onpointercancel=()=>{if(dr){dr=0;set(c.toDataURL('image/png'));tm=setTimeout(lock,1200)}}}
const sigO=()=>initSig('sg',()=>O().sig,x=>{O().sig=x;O().sigT=Date.now();sv()});
const sigT=()=>initSig('sg2',()=>S.tsig,x=>{S.tsig=x;sv()});
function R(){$('#app').innerHTML=v=='list'?VL():v=='set'?VS():v=='cd'?VC():VO();if(v=='ord')sigO();if(v=='set')sigT()}
setInterval(()=>{if(v=='ord'){const o=O(),e=$('#tt');if(o&&e&&isRun(o))e.textContent=hms(tot(o))}},1000);
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!window._rl){window._rl=1;location.reload()}})}
navigator.storage?.persist?.();
load().then(()=>{S.clients=S.clients||[];R()});
</script>

<script src="work-cloud.js"></script>
</body></html>
